# SwiftLint configuration for Middle Ground.
# Install: brew install swiftlint    Run: swiftlint --strict

included:
  - ios/MiddleGround/Sources
  - ios/MiddleGround/Tests
  - ios/MiddleGround/App

excluded:
  - ios/MiddleGround/.build
  - ios/MiddleGround/.swiftpm

disabled_rules:
  # SwiftUI view bodies are legitimately long and deeply nested.
  - type_body_length
  - function_body_length
  - closure_body_length
  - nesting

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - yoda_condition
  - force_unwrapping

line_length:
  warning: 130
  error: 180
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 800

identifier_name:
  min_length: 2
  excluded:
    - id
    - db
    - xp
    - to
    - x
    - y

type_name:
  min_length: 3

cyclomatic_complexity:
  warning: 12
  error: 20

trailing_comma:
  mandatory_comma: false

# Crashing on bad input is never acceptable in shipped code paths.
force_cast: error
force_try: error
force_unwrapping: warning

custom_rules:
  no_fatal_error:
    name: "No fatalError in shipping code"
    regex: "fatalError\\("
    match_kinds:
      - identifier
    message: "fatalError turns a recoverable condition into a launch crash. Degrade gracefully or use preconditionFailure for genuine programmer errors."
    severity: warning

  no_print:
    name: "No print()"
    regex: "(^|\\s)print\\("
    message: "Use a logger rather than print() so diagnostics are available in release builds."
    severity: warning

  no_literal_corner_radius:
    name: "Use a radius token"
    regex: "cornerRadius: [0-9]"
    message: "Use MGRadius (sm/md/lg/xl). Literals are how the app ended up with radii of 8, 12, 16, 18, 20 and 24 for the same kind of card — including a skeleton whose corners popped when real content replaced it."
    severity: warning

  no_raw_shadow_colour:
    name: "Use a shadow token"
    regex: "\\.shadow\\(color: MGColors\\.slate"
    message: "Use .mgShadow(MGShadow.md). MGColors.slate inverts to near-white in dark mode, which turns a card shadow into a glow."
    severity: warning
