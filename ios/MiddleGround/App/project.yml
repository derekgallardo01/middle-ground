# XcodeGen spec for the Middle Ground app shell.
#
# Lives in its own directory on purpose: an .xcodeproj sitting next to Package.swift
# shadows the package's own scheme, which breaks `xcodebuild -scheme MiddleGround test`.
#
# The package itself is a library; this generates the thin app shell around it so the
# target is reproducible from source instead of hand-assembled in Xcode (which is what
# the README used to ask for, and which nobody could verify).
#
#   brew install xcodegen
#   cd ios/MiddleGround/App && xcodegen generate && open MiddleGround.xcodeproj
#
# The generated .xcodeproj is gitignored — regenerate it rather than committing it.

name: MiddleGround
options:
  bundleIdPrefix: app.middleground
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    # App Store Connect rejects a re-upload that reuses a build number, so a literal "1"
    # means the first resubmission after a rejection fails at upload. Override per archive:
    #   xcodebuild ... MG_BUILD_NUMBER=$(date -u +%Y%m%d%H%M) archive
    CURRENT_PROJECT_VERSION: "$(MG_BUILD_NUMBER:default=1)"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_LANGUAGE: en
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  MiddleGround:
    path: ..

targets:
  # Deliberately *not* "MiddleGround": the package product already uses that name, and a
  # matching app target collides in the build intermediates.
  MiddleGroundApp:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - Info.plist
          - MiddleGround.entitlements
          - MiddleGroundRelease.entitlements
          # Generated into this same directory — without this it is copied into the bundle.
          - MiddleGround.xcodeproj
          # Belongs to the UI test target; compiling it into the app fails on `import XCTest`.
          - UITests
          # Firebase config is environment-specific and gitignored; bundled automatically
          # when present, but must never be a hard build dependency.
          - "*.xcarchive"
    dependencies:
      - package: MiddleGround
        product: MiddleGround
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.middleground.MiddleGround
        PRODUCT_NAME: Middle Ground
        INFOPLIST_FILE: Info.plist
        # Sign in with Apple and push both require a real team; set yours here or in Xcode.
        DEVELOPMENT_TEAM: 9U3ZSABZG7
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: MiddleGround.entitlements
          ENABLE_PREVIEWS: YES
        Release:
          # NOTE: do not set CODE_SIGN_IDENTITY here. With CODE_SIGN_STYLE: Automatic, Xcode
          # signs the *archive* with the development identity by design and refuses a manual
          # distribution identity ("conflicting provisioning settings"). Distribution signing
          # happens at export: `xcodebuild -exportArchive` with ExportOptions.plist
          # (method: app-store-connect) re-signs the payload with the Apple Distribution
          # certificate and a distribution profile. That export is what applies the
          # entitlements file below — the archive itself showing `aps-environment:
          # development` is expected and is not what gets uploaded.
          #
          # A *separate*, hand-maintained file whose `aps-environment` is `production`.
          #
          # The old comment claimed "Xcode rewrites this to production for release builds",
          # which only holds for Xcode-managed distribution export. Any `xcodebuild
          # -exportArchive` driven by an exportOptions.plist ships whatever is in the file —
          # so a development entitlement would upload happily and push would be silently
          # dead in production, with no error anywhere to explain it.
          CODE_SIGN_ENTITLEMENTS: MiddleGroundRelease.entitlements
          # Previews compile the ten `#Preview` bodies — each of which flips
          # `AppConfiguration.useMockRepositories` — into the shipping binary.
          ENABLE_PREVIEWS: NO
    # XcodeGen *generates* these files from the spec on every run, so the keys must live
    # here — anything hand-edited into AppTarget/Info.plist would be silently clobbered.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Middle Ground
        # actool also writes this nested under CFBundleIcons; declaring it top-level
        # is what the ITMS-90713 upload check looks for by name.
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # NOTE: UIBackgroundModes is deliberately absent. Declaring
        # `remote-notification` without implementing
        # application(_:didReceiveRemoteNotification:fetchCompletionHandler:) — and with
        # Cloud Functions never sending `content-available` — is a Guideline 2.5.4
        # rejection. Alert-style pushes do not need it.
        # AppDelegate sets the APNs token explicitly, so Firebase must not swizzle it.
        FirebaseAppDelegateProxyEnabled: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Calendar access is read-only and opt-in: it exists solely to say whether a proposed
        # time clashes with something already in your calendar. Nothing is written, and nothing
        # about your events leaves the device. iOS 17 split the old key in two — the full-access
        # one is what reading events requires; the legacy key stays for older systems.
        NSCalendarsFullAccessUsageDescription: >-
          Middle Ground checks whether a suggested time is already busy in your calendar.
          Your events stay on your device and are never uploaded or shared.
        NSCalendarsUsageDescription: >-
          Middle Ground checks whether a suggested time is already busy in your calendar.
          Your events stay on your device and are never uploaded or shared.

        # When In Use, and only that. Sharing is a tap that sends one point to the people on one
        # agreed plan, during the hours around it — there is no tracking, no background updates
        # and nothing to leave running. `Always` would need a background mode and a justification
        # at review that this feature does not have and does not want.
        NSLocationWhenInUseUsageDescription: >-
          Middle Ground shares your location only when you tap to share it, only with the people
          on that plan, and only around the time it is happening. It is deleted afterwards.

    # NOTE: there is deliberately no `entitlements:` block.
    #
    # XcodeGen writes exactly one entitlements file per target and sets
    # CODE_SIGN_ENTITLEMENTS at the *base* level, which silently overrides the per-config
    # values above — both Debug and Release ended up pointing at the development file, which
    # is precisely the bug this split exists to prevent. Both files are therefore committed
    # and hand-maintained; `configs:` above is the only thing that selects between them.
    #
    # Adding a capability means editing BOTH MiddleGround.entitlements and
    # MiddleGroundRelease.entitlements, or it will work in Debug and vanish in Release.

  # Drives the app on a simulator so flows are verified by running, not just compiling.
  # The package's unit tests cover logic; this covers the things only a launch can prove.
  MiddleGroundUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: MiddleGroundApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.middleground.MiddleGroundUITests
        TEST_TARGET_NAME: MiddleGroundApp
        # Required for the test bundle to be code signed, which the app needs so Firebase
        # Auth can reach the keychain (unsigned builds fail with keychain error 17995).
        GENERATE_INFOPLIST_FILE: YES

schemes:
  # App shell only. The unit tests live in the Swift package and are run against its own
  # scheme (see "Running the tests" in the README), not through this project.
  MiddleGroundApp:
    build:
      targets:
        MiddleGroundApp: all
        MiddleGroundUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MiddleGroundUITests
    archive:
      config: Release
