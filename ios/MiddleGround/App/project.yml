# XcodeGen spec for the Middle Ground app shell.
#
# Lives in its own directory on purpose: an .xcodeproj sitting next to Package.swift
# shadows the package's own scheme, which breaks `xcodebuild -scheme MiddleGround test`.
#
# The package itself is a library; this generates the thin app shell around it so the
# target is reproducible from source instead of hand-assembled in Xcode (which is what
# the README used to ask for, and which nobody could verify).
#
#   brew install xcodegen
#   cd ios/MiddleGround/App && xcodegen generate && open MiddleGround.xcodeproj
#
# The generated .xcodeproj is gitignored — regenerate it rather than committing it.

name: MiddleGround
options:
  bundleIdPrefix: app.middleground
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_LANGUAGE: en
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  MiddleGround:
    path: ..

targets:
  # Deliberately *not* "MiddleGround": the package product already uses that name, and a
  # matching app target collides in the build intermediates.
  MiddleGroundApp:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - Info.plist
          - MiddleGround.entitlements
          # Generated into this same directory — without this it is copied into the bundle.
          - MiddleGround.xcodeproj
          # Belongs to the UI test target; compiling it into the app fails on `import XCTest`.
          - UITests
          # Firebase config is environment-specific and gitignored; bundled automatically
          # when present, but must never be a hard build dependency.
          - "*.xcarchive"
    dependencies:
      - package: MiddleGround
        product: MiddleGround
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.middleground.MiddleGround
        PRODUCT_NAME: Middle Ground
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: MiddleGround.entitlements
        # Sign in with Apple and push both require a real team; set yours here or in Xcode.
        DEVELOPMENT_TEAM: 9U3ZSABZG7
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    # XcodeGen *generates* these files from the spec on every run, so the keys must live
    # here — anything hand-edited into AppTarget/Info.plist would be silently clobbered.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Middle Ground
        # actool also writes this nested under CFBundleIcons; declaring it top-level
        # is what the ITMS-90713 upload check looks for by name.
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # NOTE: UIBackgroundModes is deliberately absent. Declaring
        # `remote-notification` without implementing
        # application(_:didReceiveRemoteNotification:fetchCompletionHandler:) — and with
        # Cloud Functions never sending `content-available` — is a Guideline 2.5.4
        # rejection. Alert-style pushes do not need it.
        # AppDelegate sets the APNs token explicitly, so Firebase must not swizzle it.
        FirebaseAppDelegateProxyEnabled: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false

    entitlements:
      path: MiddleGround.entitlements
      properties:
        # Required by SignInWithAppleManager / AuthService.signInWithApple.
        com.apple.developer.applesignin:
          - Default
        # Required for push. Xcode rewrites this to "production" for release builds.
        aps-environment: development

  # Drives the app on a simulator so flows are verified by running, not just compiling.
  # The package's unit tests cover logic; this covers the things only a launch can prove.
  MiddleGroundUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: MiddleGroundApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.middleground.MiddleGroundUITests
        TEST_TARGET_NAME: MiddleGroundApp
        # Required for the test bundle to be code signed, which the app needs so Firebase
        # Auth can reach the keychain (unsigned builds fail with keychain error 17995).
        GENERATE_INFOPLIST_FILE: YES

schemes:
  # App shell only. The unit tests live in the Swift package and are run against its own
  # scheme (see "Running the tests" in the README), not through this project.
  MiddleGroundApp:
    build:
      targets:
        MiddleGroundApp: all
        MiddleGroundUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MiddleGroundUITests
    archive:
      config: Release
